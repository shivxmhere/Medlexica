version: '3.8'
services:
  medlexica-api:
    build: .
    container_name: medlexica-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./rag:/app/rag
      - ./data:/app/data
      - ./api/query_log.jsonl:/app/api/query_log.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
